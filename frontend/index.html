<!DOCTYPE html>
<!-- CoverCraft terminal UI. Surface: Operate (workbench), style: Cyber/Technical.
     Tokens per ui-ux-pro-max: semantic, 4/8px rhythm, rem units, dark-first.
     Settings live in Go (~/.config/covercraft), served via /api/settings. -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoverCraft</title>
<style>
:root {
  /* Terminal palette — semantic tokens, dark-first (ui-ux-pro-max §6) */
  --bg: #0b0e12;           /* терминальный чёрный с синевой */
  --bg-elev: #10141b;      /* панели */
  --bg-inset: #07090d;     /* поля ввода — глубже фона */
  --ink: #c9d4e0;          /* основной текст */
  --ink-dim: #7e8b9e;      /* подписи, вторичный */
  --ink-faint: #525f72;    /* подсказки, рамки */
  --accent: #2fe08b;      /* терминальный зелёный */
  --accent-ink: #062a18;   /* текст на акценте */
  --accent-dim: rgba(47, 224, 139, .13);
  --danger: #ff5d5d;
  --danger-dim: rgba(255, 93, 93, .12);
  --warn: #ffb454;
  --ok: #2fe08b;
  --border: #1d2632;       /* рамки панелей */
  --border-focus: #2fe08b;
  --focus-ring: rgba(47, 224, 139, .55);
  --radius: 4px;           /* терминалы не круглые */
  --font-mono: "JetBrains Mono", "Fira Code", "Ubuntu Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --font-emoji: "Noto Color Emoji";
  --dur: 180ms;            /* 150–300ms по ui-ux-pro-max §7 */
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2f4f7; --bg-elev: #ffffff; --bg-inset: #e9edf2;
    --ink: #1c2430; --ink-dim: #55627a; --ink-faint: #8a94a8;
    --accent: #0b7a45; --accent-ink: #ffffff; --accent-dim: rgba(11, 122, 69, .09);
    --danger: #c22f2f; --danger-dim: rgba(194, 47, 47, .08);
    --warn: #9a6a00; --ok: #0b7a45; --border: #d4dae4; --border-focus: #0b7a45;
    --focus-ring: rgba(11, 122, 69, .45);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.6 var(--font-mono), var(--font-emoji);
  color: var(--ink);
  background: var(--bg);
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- Header: терминальная строка статуса ---------- */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 14px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  min-height: 48px;
}
.logo {
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 15px; letter-spacing: .5px;
  color: var(--ink);
}
.logo svg { width: 18px; height: 18px; flex: none; }
.prompt-sign { color: var(--accent); font-weight: 700; }
#model-chip {
  font-size: 12px; color: var(--ink-dim);
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-inset);
  max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#model-chip:empty { display: none; }
header .spacer { flex: 1; }

/* ---------- Layout: две колонки, mobile-first ---------- */
main {
  display: grid;
  grid-template-columns: 1fr;   /* mobile-first: одна колонка */
  min-height: 0;
  overflow: hidden;
}
.pane {
  display: flex; flex-direction: column; gap: 12px;
  padding: 14px;
  min-height: 0; min-width: 0;
}
@media (min-width: 768px) {
  main { grid-template-columns: minmax(340px, 460px) 1fr; }
  .pane + .pane { border-left: 1px solid var(--border); }
}
@media (max-width: 767px) {
  body { overflow: auto; }
  main { overflow: auto; }
  .pane + .pane { border-top: 1px solid var(--border); }
}

/* ---------- Панель с заголовком-терминальным префиксом ---------- */
.panel {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  flex: none;
}
.panel-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-inset);
  cursor: pointer;
  user-select: none;
  min-height: 44px;      /* touch target (ui-ux-pro-max §2) */
}
.panel-head:hover { background: var(--accent-dim); }
.panel-head:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
.panel-title {
  font-size: 12px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.panel-title::before { content: "$ "; color: var(--accent); }
.panel-sub {
  margin-left: auto;
  font-size: 11px; color: var(--ink-faint);
  max-width: 20ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.caret {
  margin-left: auto;
  color: var(--ink-faint);
  transition: transform var(--dur) ease-out;
  font-size: 10px;
}
.panel[open] > .panel-head .caret { transform: rotate(90deg); }
.panel-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* ---------- Формы ---------- */
label {
  display: block;
  font-size: 11px; letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-bottom: 4px;
}
input[type=text], input[type=password], input[type=number], textarea, select {
  width: 100%;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink);
  padding: 9px 11px;
  min-height: 44px;          /* touch-friendly (responsive skill) */
  font-size: 13px;
  transition: border-color var(--dur) ease-out, box-shadow var(--dur) ease-out;
}
select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%),
                    linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  padding-right: 28px;
  cursor: pointer;
}
select option { background: var(--bg-elev); color: var(--ink); }
textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
input::placeholder, textarea::placeholder { color: var(--ink-faint); }
input:focus-visible, textarea:focus-visible {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--focus-ring);
}
.field { display: flex; flex-direction: column; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 480px) { .grid2 { grid-template-columns: 1fr 1fr; } }

/* Vacancy = главный ввод */
#vacancy-wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 150px; }
#vacancy-wrap .field, #vacancy { flex: 1; min-height: 0; min-height: 120px; }
#vacancy { height: 100%; }

/* ---------- Результат: письмо ---------- */
#result-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 0; }
#result-wrap .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#result-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; min-height: 44px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-inset);
}
#result-bar .panel-title { color: var(--ink); }
#count {
  font-size: 11px; color: var(--ink-faint); margin-left: auto;
  font-variant-numeric: tabular-nums;   /* number-tabular: цифры не прыгают */
}
#result {
  flex: 1; min-height: 0; overflow: auto;
  background: var(--bg-elev);
  padding: 16px 18px;
  font-size: 14px; line-height: 1.75;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
#result:empty::before {
  content: "# письмо появится здесь\A# вставьте вакансию и нажмите [ gen ]";
  white-space: pre-wrap;
  color: var(--ink-faint);
}
#result:focus-visible { outline-offset: -3px; outline: 2px solid var(--focus-ring); }

/* ---------- Постпроверка письма (internal/audit) ---------- */
#audit-warns {
  border-top: 1px solid var(--border);
  background: var(--danger-dim);
  color: var(--ink);
  padding: 8px 12px;
  font-size: 12px;
  line-height: 1.5;
  max-height: 140px;
  overflow: auto;
}
#audit-warns .warn-title {
  display: block;
  color: var(--warn);
  font-weight: 700;
  letter-spacing: .5px;
  margin-bottom: 4px;
}
#audit-warns ul { margin: 0; padding-left: 18px; }
#audit-warns li { margin: 2px 0; }

#profile-warning {
  margin: 8px 12px 0;
  padding: 8px 10px;
  border: 1px solid var(--warn);
  border-radius: var(--radius);
  color: var(--warn);
  font-size: 12px;
  line-height: 1.5;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.prompt-dropinfo {
  margin: 4px 0 8px;
  font-size: 11px;
  color: var(--ink-faint);
  line-height: 1.5;
}
.prompt-dropinfo.mismatch {
  color: var(--warn);
  font-weight: 600;
}

/* Факт, подтверждённый генерацией: что реально ушло в модель. Отличается от
   .prompt-dropinfo (там намерение композера) — расхождение между ними и есть
   сигнал «compose посчитал не то», поэтому выделено цветом. */
.prompt-sentinfo {
  margin: 4px 0 8px;
  font-size: 11px;
  color: var(--ink-faint);
  line-height: 1.5;
}

.prompt-sentinfo.mismatch {
  color: var(--warn);
  font-weight: 600;
}

/* ---------- Модалка создания/правки пресета ---------- */
/* Поле имени одного prompt() мало: пользователь не видит, КАКОЙ текст
   уйдёт в пресет (живой случай: пресет создался со снимком дефолта,
   а не с KISS-текстом). Модалка показывает оба поля и правит их. */
.preset-modal {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 0, 0, .55);
}
.preset-modal[hidden] { display: none; }
.preset-modal-box {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  width: min(560px, 100%);
  max-height: 86vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.preset-modal-box textarea { min-height: 220px; }

/* ---------- uiConfirm — стилевое подтверждение ---------- */
/* Нативный confirm рисует WebKit, CSS его не достает: окно выглядит
   чужим приложением (заголовок «JavaScript — http://127.0.0.1…» ).
   Эта модалка переиспользует классы пресет-модалки; вызывается через
   uiConfirm(text) → Promise<boolean>. При открытом confirm body имеет
   класс .confirm-open, который блокирует ТОЛЬКО кнопки панели пресетов
   (savePreset, editPreset, newPreset, delPreset, presetSelect). Кнопки
   самой модалки подтверждения (confirmOk, confirmCancel) этим не затрагиваются. */
.confirm-modal-box { width: min(440px, 100%); }
.confirm-modal-box p { margin: 0; line-height: 1.45; }
/* Блокируем кнопки панели пресетов когда confirm открыт */
body.confirm-open .btn#savePreset,
body.confirm-open .btn#editPreset,
body.confirm-open .btn#newPreset,
body.confirm-open .btn#delPreset,
body.confirm-open #presetSelect { opacity: 0.4; pointer-events: none; }

/* Compose-область не должна расти за пределы панели: когда compose
   наполнил блоки prompt-dropinfo/sentinfo крупным текстом (и кастомный
   промпт большой), панель может выйти за висоту окна, а main/body на
   десктопе overflow:hidden — кнопки (compose/вернуть/reset) оказываются
   ниже видимой области без прокрутки. Ограничиваем тело панели и
   прокручиваем его; строка кнопок липнет к низу панели и не уходит. */
#prompt-details .panel-body {
  max-height: 46vh;
  overflow-y: auto;
  overscroll-behavior: contain;
}
#prompt-details .btn-row {
  position: sticky;
  bottom: -12px; /* компенсирует padding .panel-body */
  background: var(--bg-elev);
  padding: 6px 0;
  margin-top: auto;
  flex: none;
}


/* ---------- Рекомендация отклика (internal/fit) ---------- */
#fit-verdict {
  border-top: 1px solid var(--border);
  background: var(--bg-inset);
  color: var(--ink);
  padding: 8px 12px;
  font-size: 12px;
  line-height: 1.5;
  max-height: 180px;
  overflow: auto;
}
#fit-verdict .fit-title { display: block; font-weight: 700; letter-spacing: .5px; margin-bottom: 4px; }
#fit-verdict.verdict-apply .fit-title { color: var(--ok); }
#fit-verdict.verdict-apply_with_caveats .fit-title { color: var(--warn); }
#fit-verdict.verdict-skip .fit-title { color: var(--danger); }
/* verdict-note — вердикта нет, панель объясняет причину (упавший разбор
   вакансии). Без этого панель просто исчезала, а кнопка fit-fix
   оставалась: пользователь видел противоречие (живой баг, октябрь 2026). */
#fit-verdict.verdict-note .fit-title { color: var(--warn); }
#fit-verdict ul { margin: 0; padding-left: 18px; }
#fit-verdict li { margin: 2px 0; }

/* ---------- Кнопки: терминальные ---------- */
button.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg-inset);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink);
  min-height: 44px; padding: 8px 16px;
  font-size: 13px; font-weight: 600; letter-spacing: .3px;
  transition: background-color var(--dur) ease-out, border-color var(--dur) ease-out,
              transform var(--dur) ease-out, opacity var(--dur) ease-out;
}
button.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.btn:active:not(:disabled) { transform: translateY(1px); }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
button.btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
button.btn.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
button.btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: var(--accent-ink); }
button.btn.primary:disabled { opacity: .45; }
.btn .kbrd {
  font-size: 10px; opacity: .75;
  border: 1px solid currentColor; border-radius: 2px; padding: 1px 4px;
}
/* terminal button: [ gen ] */
button.btn.term {
  background: transparent;
  font-family: inherit;
}
button.btn.term::before { content: "["; color: var(--accent); }
button.btn.term::after { content: "]"; color: var(--accent); }
button.btn.term:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
/* gen — терминальная кнопка с прозрачным фоном (.term перебивает фон
   .primary), поэтому текст берёт --ink как у stop, а не тёмный --accent-ink,
   рассчитанный на зелёной заливке. */
button.btn.term.primary { color: var(--ink); }

/* ---------- Статусная строка ---------- */
footer {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 14px;
  background: var(--bg-elev);
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--ink-dim);
  min-height: 32px;
  flex-wrap: wrap;
}
footer.err { color: var(--danger); }
footer .spacer { flex: 1; }
.status-prefix { color: var(--accent); font-weight: 700; }
footer.err .status-prefix { color: var(--danger); }
.copy {
  font-size: 11px; color: var(--ink-faint);
  margin-left: 4px; white-space: nowrap;
}
.copy a { color: var(--ink-faint); text-decoration: none; border-bottom: 1px dotted var(--ink-faint); }
.copy a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.copy .sep { margin: 0 5px; opacity: .6; }
.spin {
  width: 12px; height: 12px; flex: none;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  display: none;
}
body.busy .spin { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spin { animation: none; }
  * { transition-duration: 0ms !important; }
}
/* Сканирующая линия при генерации — motion conveys meaning (§7) */
@keyframes scanline {
  from { transform: translateX(-100%); }
  to   { transform: translateX(100%); }
}
#scan {
  position: fixed; left: 0; right: 0; top: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0;
  pointer-events: none;
  z-index: 100;
}
body.busy #scan {
  animation: scanline 1.4s linear infinite;
  opacity: .5;
}
@media (prefers-reduced-motion: reduce) { body.busy #scan { animation: none; opacity: .15; } }

/* ---------- Copy feedback ---------- */
#copy.ok { color: var(--ok); border-color: var(--ok); }
</style>
</head>
<body>
<div id="scan" aria-hidden="true"></div>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="4 17 10 11 4 5"></polyline>
      <line x1="12" y1="19" x2="20" y2="19"></line>
    </svg>
    <span><span class="prompt-sign">~$</span> covercraft</span>
  </div>
  <span id="model-chip" role="status"></span>
  <span class="spacer"></span>
  <span class="spin" id="spin" aria-hidden="true"></span>
  <button class="btn term primary" id="generate" disabled>
    <span>gen</span>
    <span class="kbrd">Ctrl+↵</span>
  </button>
  <button class="btn term" id="stop" hidden><span>stop</span></button>
</header>

<main>
  <!-- ======== Левая колонка: ввод ======== -->
  <section class="pane" aria-label="Ввод">
    <details class="panel" id="api-details" open>
      <summary class="panel-head">
        <span class="panel-title">api.config</span>
        <span class="panel-sub" id="api-sub">не настроено</span>
        <span class="caret">▶</span>
      </summary>
      <div class="panel-body">
        <div class="field">
          <label for="baseUrl">base_url</label>
          <input type="text" id="baseUrl" placeholder="http://127.0.0.1:11434/v1" spellcheck="false" autocomplete="off">
        </div>
        <div class="grid2">
          <div class="field">
            <label for="apiKey">api_key (пусто для ollama)</label>
            <input type="password" id="apiKey" placeholder="sk-…" spellcheck="false" autocomplete="off">
          </div>
          <div class="field">
            <label for="model">model</label>
            <input type="text" id="model" placeholder="llama3.2" spellcheck="false" autocomplete="off">
          </div>
          <div class="field">
            <label for="reasoningEffort">reasoning_effort</label>
            <select id="reasoningEffort" title="Для reasoning-моделей (glm и др.): none — не думать, иначе могут генерировать минутами. Пусто — не отправлять параметр.">
              <option value="" selected>не отправлять</option>
              <option value="none">none — отключить</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
            </select>
          </div>
          <div class="field">
            <label for="timeoutSec">timeout (сек, 5–900)</label>
            <input type="number" id="timeoutSec" min="5" max="900" step="5" value="60" title="Сколько ждать ответа модели до ошибки «таймаут». 60 с хватает быстрым моделям; медленным reasoning поднимите.">
          </div>
          <div class="field">
            <label for="fitEngine">fit engine</label>
            <select id="fitEngine" title="deterministic — матчер на правилах, ноль дополнительных LLM-вызовов. llm — гибрид: модель размечает покрытие письма, код проверяет цитаты и отрицания. При ошибке модели — автооткат на deterministic.">
              <option value="" selected>deterministic — правила</option>
              <option value="llm">llm — гибрид</option>
            </select>
          </div>
        </div>
      </div>
    </details>

    <details class="panel" id="prompt-details">
      <summary class="panel-head">
        <span class="panel-title">system.prompt</span>
        <span class="panel-sub" id="prompt-sub"></span>
        <span class="caret">▶</span>
      </summary>
      <div class="panel-body">
        <div class="field">
          <label for="presetSelect">presets — заготовки промптов под разные цели</label>
          <select id="presetSelect" title="выбранный пресет копируется в поле ниже; правки сессионные, в пресет уходят только по кнопке save preset">
            <option value="">— без пресета —</option>
          </select>
        </div>
        <div class="field">
          <label for="systemPrompt">инструкция модели — кастом до перезапуска</label>
          <textarea id="systemPrompt" rows="6" spellcheck="false" placeholder="Ты помощник по сопроводительным письмам…"></textarea>
        </div>
        <div class="prompt-dropinfo" id="prompt-dropinfo" hidden></div>
        <div class="prompt-sentinfo" id="prompt-sentinfo" role="status" hidden></div>
        <div class="btn-row">
          <button class="btn term" id="composePrompt" type="button"
                  title="собрать системный промпт под текущую вакансию и убрать нерелевантные разделы профиля — можно править вручную">
            <span>compose</span>
          </button>
          <button class="btn term" id="undoPrompt" type="button" hidden><span>вернуть прежний</span></button>
          <button class="btn term" id="resetPrompt" type="button"><span>reset default</span></button>
          <button class="btn term" id="savePreset" type="button"
                  title="сохранить текущее поле в активный пресет; если пресет не выбран — создать новый">
            <span>save preset</span>
          </button>
          <button class="btn term" id="editPreset" type="button"
                  title="править имя и текст активного пресета">
            <span>edit preset</span>
          </button>
          <button class="btn term" id="newPreset" type="button"
                  title="создать новый пресет: имя и текст задаются в окне">
            <span>new preset</span>
          </button>
          <button class="btn term" id="delPreset" type="button"
                  title="удалить выбранный пресет — поле не трогается">
            <span>del preset</span>
          </button>
        </div>
      </div>
    </details>

    <!-- Модалка пресета: имя + текст. Отдельно от панели, fixed-overlay:
         кнопки панели остаются кликабельными после закрытия, модалка их
         не «залипает». -->
    <div class="preset-modal" id="presetModal" hidden role="dialog"
         aria-modal="true" aria-labelledby="presetModalTitle">
      <div class="preset-modal-box">
        <span class="panel-title" id="presetModalTitle">новый пресет</span>
        <div class="field">
          <label for="presetName">имя — появится в селекторе presets</label>
          <input type="text" id="presetName" maxlength="80" spellcheck="false">
        </div>
        <div class="field">
          <label for="presetText">текст — именно он уйдёт в модель как системный промпт
            <span class="prompt-dropinfo" id="presetLen"></span>
          </label>
          <textarea id="presetText" rows="8" spellcheck="false"
                    placeholder="Ты — ведущий backend-архитектор… Отвечай кратко по существу."></textarea>
        </div>
        <div class="field">
          <label for="presetMode">режим пресета — «qa» без fit/audit (на сервере)</label>
          <select id="presetMode">
            <option value="cover_letter">письмо (compose + fit + audit)</option>
            <option value="qa">qa (без fit/audit)</option>
          </select>
        </div>
        <div class="btn-row">
          <button class="btn term" id="presetOk" type="button"><span>ok</span></button>
          <button class="btn term" id="presetCancel" type="button"><span>отмена</span></button>
        </div>
      </div>
    </div>

    <!-- Модалка подтверждения вместо нативного confirm: тот же оверлей,
         те же классы. Одна на всё приложение — резолвит uiConfirm(). -->
    <div class="preset-modal" id="confirmModal" hidden role="dialog"
         aria-modal="true" aria-labelledby="confirmText">
      <div class="preset-modal-box confirm-modal-box">
        <span class="panel-title">подтверждение</span>
        <p id="confirmText"></p>
        <div class="btn-row">
          <button class="btn term primary" id="confirmOk" type="button"><span>ok</span></button>
          <button class="btn term" id="confirmCancel" type="button"><span>отмена</span></button>
        </div>
      </div>
    </div>

    <div id="vacancy-wrap">
      <div class="field">
        <label for="vacancy">vacancy.in — описание вакансии</label>
        <textarea id="vacancy" spellcheck="false" placeholder="# вставьте текст вакансии…"></textarea>
      </div>
    </div>
  </section>

  <!-- ======== Правая колонка: результат ======== -->
  <section class="pane" aria-label="Результат">
    <div id="result-wrap">
      <div class="panel">
        <div id="result-bar">
          <span class="panel-title">letter.out</span>
          <button class="btn term" id="copy" disabled><span>copy</span></button>
          <span id="count"></span>
        </div>
        <div id="result" contenteditable="true" spellcheck="true" role="textbox"
             aria-live="polite" aria-multiline="true" aria-label="Сгенерированное письмо — можно отредактировать"></div>
        <div id="audit-warns" hidden></div>
        <div id="profile-warning" hidden></div>
        <div id="fit-verdict" hidden></div>
      </div>
    </div>
  </section>
</main>

<footer id="status" role="status">
  <span class="status-prefix">❯</span>
  <span id="status-text">готово.</span>
  <span class="spacer"></span>
  <span>ctrl+enter — генерировать · esc — сброс</span>
  <span class="copy">
    <span class="sep">·</span>
    Developed:
    <a href="https://github.com/turkprogrammer" title="GitHub">Robert Yusupov</a>
    <a href="https://yusupov-tech.ru/" title="Сайт">◍</a>
  </span>
</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const els = {
  chip: $("model-chip"), spin: $("spin"),
  generate: $("generate"), stop: $("stop"), copy: $("copy"), result: $("result"), count: $("count"),
  status: $("status"), statusText: $("status-text"),
  baseUrl: $("baseUrl"), apiKey: $("apiKey"), model: $("model"),
  systemPrompt: $("systemPrompt"), reasoningEffort: $("reasoningEffort"),
  timeoutSec: $("timeoutSec"), fitEngine: $("fitEngine"),
  vacancy: $("vacancy"), apiSub: $("api-sub"), promptSub: $("prompt-sub"),
  composePrompt: $("composePrompt"), undoPrompt: $("undoPrompt"),
  presetSelect: $("presetSelect"),
  presetMode: $("presetMode"),
  savePreset: $("savePreset"), newPreset: $("newPreset"), delPreset: $("delPreset"),
  editPreset: $("editPreset"),
  promptDropInfo: $("prompt-dropinfo"),
  promptSentInfo: $("prompt-sentinfo"),
  auditWarns: $("audit-warns"),
  profileWarning: $("profile-warning"),
  fitVerdict: $("fit-verdict"),
};

function setStatus(text, cls) {
  els.statusText.textContent = text;
  els.status.className = cls || "";
}
// busy — идёт ли сейчас генерация. body.busy ставит setBusy, а он на весь
// цикл fit-fix остаётся включённым: пока цикл идёт, заново созданная
// showFitFixButton кнопка обязана быть неактивной, иначе второй клик
// запускает второй стрим в тот же els.result.
function busy() {
  return document.body.classList.contains("busy");
}
function setBusy(on) {
  document.body.classList.toggle("busy", on);
  els.generate.disabled = on || !els.vacancy.value.trim();
  els.stop.hidden = !on;
  syncPromptButtons();
}
// setProfileWarning — баннер «профиля нет». Приходит отдельным полем
// profileWarning из SSE-done, а не в warnings: warnings уходят обратно в
// модель при автоправке, и такая инструкция заставила бы её выдумывать факты.
function setProfileWarning(msg) {
  if (!els.profileWarning) return;
  els.profileWarning.textContent = msg || "";
  els.profileWarning.hidden = !msg;
}
function chip(model) {
  els.chip.textContent = model ? "@" + model : "";
  els.apiSub.textContent = model || "не настроено";
}

/* ---------- settings: владеет Go, автосейв с дебаунсом 400мс ---------- */
/* Промпт — исключение: не персистится. При запуске всегда дефолт из бэкенда,
   кастом живёт в поле до перезапуска (передаётся в /api/generate). */
let saveTimer = null;
let defaultPrompt = "";
// Состояние compose: снимок отбора до композа, текущий список вырезаемых
// разделов профиля и вакансия, под которую он собран. Промпт в это состояние
// не входит: композер его не пишет.
let promptUndo = null;      // {drops, stats, vacancy} — снимок до compose
let promptDrops = [];       // dropSections, применяемые в /api/generate
let promptDropStats = null; // {sections, droppedBytes, reason} из ответа compose
let promptVacancy = "";     // вакансия, под которую собран promptDrops
// Пресеты — именованные шаблоны промптов (хранятся в presets.json).
// Пресет = шаблон: выбор копирует текст в поле, правки сессионные и в
// пресет уходят только по save preset. presetSnapshot — последний текст,
// который мы сами положили в поле; отличие от него = «правки».
let presetList = [];        // последние данные сервера (view.presets)
let presetActiveId = "";    // активный пресет или "" (кастом)
let presetSnapshot = "";    // текст в поле без учёта правок
let currentPresetMode = "cover_letter";    // режим активного пресета или кастом
function readForm() {
  const t = parseInt(els.timeoutSec.value, 10);
  return {
    baseUrl: els.baseUrl.value.trim(),
    apiKey: els.apiKey.value,
    model: els.model.value.trim(),
    reasoningEffort: els.reasoningEffort.value,
    fitEngine: els.fitEngine.value,
    timeoutSec: Number.isFinite(t) ? Math.min(900, Math.max(5, t)) : 60,
  };
}
function fillForm(s) {
  els.baseUrl.value = s.baseUrl || "";
  els.apiKey.value = s.apiKey || "";
  els.model.value = s.model || "";
  els.reasoningEffort.value = s.reasoningEffort || "";
  els.fitEngine.value = s.fitEngine || "";
  els.timeoutSec.value = s.timeoutSec || 60;
  defaultPrompt = s.defaultSystemPrompt || "";
  els.systemPrompt.value = defaultPrompt;
  presetSnapshot = defaultPrompt;
  chip(els.model.value.trim());
  promptState();
}
function resetPrompt() {
  els.systemPrompt.value = defaultPrompt;
  presetSnapshot = defaultPrompt;
  // Сброс к дефолту снимает привязку к пресету — иначе на старте поле
  // снова заполнилось бы текстом пресета, несмотря на явный reset.
  if (presetActiveId) {
    presetActiveId = "";
    renderPresetSelect();
    setPresetActive("").catch(e => setStatus("err: пресеты: " + e.message, "err"));
  }
  promptDrops = [];
  promptDropStats = null;
  promptVacancy = "";
  promptUndo = null;
  els.undoPrompt.hidden = true;
  renderDropInfo();
  promptState();
  els.systemPrompt.focus();
}

// promptState — единый источник статуса #prompt-sub: preset (выбран
// пресет, правки видны как «· правки») / custom (непустое поле без
// пресета) / default (пустое — на бэке дефолт). Статус «авто» удалён
// вместе с переписыванием промпта композером: поле больше не
// перезаписывается, поэтому подписи нечему врать.
function promptState() {
  let src = els.systemPrompt.value.trim() === "" ? "default" : "custom";
  let label = src === "custom" ? "кастом (сброс при перезапуске)" : "default";
  if (presetActiveId) {
    const p = presetList.find(x => x.id === presetActiveId);
    const dirty = els.systemPrompt.value !== presetSnapshot;
    const qa = p && p.mode === "qa";
    label = "пресет: " + (p ? p.name : "?") + (qa ? " [QA]" : "") + (dirty ? " · правки" : "");
    src = "preset";
  }
  els.promptSub.textContent = label;
  return src;
}

// uiConfirm — подтверждение в стиле приложения вместо нативного
// confirm: WebKit рисует своё окно с заголовком «JavaScript —
// http://127.0.0.1…», чужое теме. Резолвит Promise<boolean>: ok → true,
// отмена/Esc/клик по подложке → false. Пока окно открыто, кнопки панели
// блокируются (класс .confirm-open на body), чтобы избежать реентерабельных
// вызовов, которые перезатёрли бы резолвер и повисили бы await.
let confirmResolve = null;
function uiConfirm(text) {
  document.body.classList.add("confirm-open");
  $("confirmText").textContent = text;
  $("confirmModal").hidden = false;
  $("confirmOk").focus();
  return new Promise(res => { confirmResolve = res; });
}
function settleConfirm(val) {
  if (!confirmResolve) return;
  const r = confirmResolve;
  confirmResolve = null;
  document.body.classList.remove("confirm-open");
  $("confirmModal").hidden = true;
  r(val);
}

// syncPromptButtons — compose доступен только когда не идёт генерация и
// вакансия заполнена (пустая вакансия не должна стоить LLM-вызова).
function syncPromptButtons() {
  els.composePrompt.disabled = busy() || !els.vacancy.value.trim();
}

/* ---------- presets: шаблоны промптов ---------- */
// applyPresetView — состояние с сервера (список + активный) → память и
// селектор. Все мутации возвращают полный view, поэтому один хелпер.
function applyPresetView(view) {
  presetList = (view && view.presets) || [];
  presetActiveId = (view && view.activePresetId) || "";
  renderPresetSelect();
}
// renderPresetSelect — пересобрать селектор из presetList, значение =
// активный пресет. Без внутреннего состояния список протухает после
// удаления, а селектор продолжал бы показывать удалённый пункт.
function renderPresetSelect() {
  const sel = els.presetSelect;
  if (!sel) return;
  sel.innerHTML = "<option value=\"\">— без пресета —</option>";
  for (const p of presetList) {
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = p.name;
    sel.appendChild(o);
  }
  sel.value = presetActiveId;
}
// setPresetActive — активация/снятие привязки на сервере.
async function setPresetActive(id) {
  const r = await fetch("/api/presets/active", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id }),
  });
  if (!r.ok) throw new Error((await r.text()) || ("HTTP " + r.status));
  applyPresetView(await r.json());
  const p = presetList.find(x => x.id === presetActiveId);
  currentPresetMode = p ? p.mode : "cover_letter";
}
// presetRequest — единый шов пресет-мутаций: метод, тело, текст ошибки
// сервера (http.Error отдаёт text/plain, не JSON).
async function presetRequest(method, body) {
  const r = await fetch("/api/presets", {
    method,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error((await r.text()) || ("HTTP " + r.status));
  return r.json();
}
// loadPresets — стартует после fillForm: активный пресет копируется в
// поле (сессионная копия), без привязки поле остаётся дефолтным.
async function loadPresets() {
  try {
    const r = await fetch("/api/presets");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const view = await r.json();
    applyPresetView(view);
    const active = presetList.find(x => x.id === presetActiveId);
    currentPresetMode = active ? active.mode : "cover_letter";
    if (active) {
      els.systemPrompt.value = active.systemPrompt;
      presetSnapshot = active.systemPrompt;
    }
    promptState();
  } catch (e) {
    setStatus("err: пресеты не загрузились: " + e.message, "err");
  }
}
// switchPreset — выбор в селекторе. Пресет = шаблон: текст копируется в
// поле, правки откатываются только после confirm (правки сессионные, но
// молча терять их нельзя).
async function switchPreset() {
  const id = els.presetSelect.value;
  if (id === presetActiveId) return;
  try {
    if (id === "") {
      // Без привязки поле возвращается к дефолтному промпту: иначе текст
      // бывшего пресета остаётся в поле, и состояние «без пресета»
      // выглядит как «последний пресет». Правки несём через confirm —
      // тот же контракт, что при выборе пресета.
      if (els.systemPrompt.value !== presetSnapshot &&
          !(await uiConfirm("Правки промпта не сохранены. Вернуть дефолтный промпт?"))) {
        els.presetSelect.value = presetActiveId;
        return;
      }
      await setPresetActive("");
      els.systemPrompt.value = defaultPrompt;
      presetSnapshot = defaultPrompt;
      promptState();
      return;
    }
    // Выбор пресета заменяет поле его шаблоном: несохранённые правки
    // пропали бы молча — спрашиваем.
    if (els.systemPrompt.value !== presetSnapshot &&
        !(await uiConfirm("Правки промпта не сохранены. Заменить их текстом пресета?"))) {
      els.presetSelect.value = presetActiveId;
      return;
    }
    const p = presetList.find(x => x.id === id);
    if (!p) return;
    els.systemPrompt.value = p.systemPrompt;
    presetSnapshot = p.systemPrompt;
    await setPresetActive(id);
    currentPresetMode = p.mode;
    promptState();
    setStatus("пресет «" + p.name + "» загружен в поле.");
  } catch (e) {
    setStatus("err: пресеты: " + e.message, "err");
  }
}
// savePreset — «save»: активный пресет обновляется текстом поля; без
// активного — это создание нового через модалку (текст виден до сохранения).
async function savePreset() {
  if (!presetActiveId) {
    openPresetModal("create");
    return;
  }
  try {
    const view = await presetRequest("PUT", { id: presetActiveId, systemPrompt: els.systemPrompt.value, mode: currentPresetMode });
    applyPresetView(view);
    presetSnapshot = els.systemPrompt.value;
    promptState();
    setStatus("пресет сохранён.");
  } catch (e) {
    setStatus("err: пресет не сохранён: " + e.message, "err");
  }
}
// newPreset — создание с нуля: пустое имя, пустой текст. Предзаполнение
// полем — сюрприз (пользователь видит текст активного пресета и решает,
// что окно открылось не для нового), поэтому blank явный.
function newPreset() {
  openPresetModal("create", "");
}

/* ---------- Модалка пресета: имя + текст ---------- */
let presetModalMode = "create"; // "create" | "edit"

// openPresetModal — заполнить и показать. create: текст = prefill, если
// задан (save preset без активного — снимок поля), иначе пусто; edit:
// текст = сохранённый пресет (правится шаблон, а не сессионная копия).
function openPresetModal(mode, prefill) {
  const active = presetList.find(x => x.id === presetActiveId);
  if (mode === "edit") {
    if (!presetActiveId) {
      setStatus("правка: сначала выберите пресет в селекторе.");
      return;
    }
    if (!active) return;
    presetModalMode = "edit";
    $("presetModalTitle").textContent = "правка пресета";
    $("presetName").value = active.name;
    $("presetText").value = active.systemPrompt;
    els.presetMode.value = active.mode || "cover_letter";
  } else {
    presetModalMode = "create";
    $("presetModalTitle").textContent = "новый пресет";
    $("presetName").value = "";
    $("presetText").value = prefill !== undefined ? prefill : els.systemPrompt.value;
    els.presetMode.value = "cover_letter";
  }
  $("presetModal").hidden = false;
  updatePresetLen();
  $("presetName").focus();
}
function closePresetModal() {
  $("presetModal").hidden = true;
}
// updatePresetLen — счётчик байт текста пресета, информационный: длина
// не блокирует сохранение (поле #systemPrompt не ограничено), но 98 КБ
// v4 видно до нажатия ok. Считает TextEncoder — совпадает с len(string)
// на бэке. Жёлтый при >8192: тот же порог, что в предупреждении
// renderSentInfo («системный промпт вчетверо больше дефолта»).
function updatePresetLen() {
  const el = $("presetLen");
  if (!el) return;
  const n = new TextEncoder().encode($("presetText").value).length;
  el.textContent = n + " байт";
  el.classList.toggle("mismatch", n > 8192);
}
// submitPresetModal — create: POST + активация; edit: PUT по активному.
// Поле промпта приравнивается к тексту из модалки: активный пресет и поле
// должны совпасть, иначе подпись «пресет: X» врёт о снимке.
async function submitPresetModal() {
  const name = $("presetName").value.trim();
  const text = $("presetText").value;
  const mode = els.presetMode.value === "qa" ? "qa" : "cover_letter";
  if (!name || !text.trim()) {
    setStatus("err: имя и текст пресета обязательны", "err");
    return;
  }
  // Правка шаблона затирает сессионные правки в поле — спрашиваем.
  if (els.systemPrompt.value !== presetSnapshot &&
      !(await uiConfirm("Поле содержит несохранённые правки. Заменить их текстом пресета?"))) {
    return;
  }
  try {
    if (presetModalMode === "edit") {
      const view = await presetRequest("PUT", { id: presetActiveId, name, systemPrompt: text, mode });
      applyPresetView(view);
      setStatus("пресет «" + name + "» обновлён.");
    } else {
      const view = await presetRequest("POST", { name, systemPrompt: text, mode });
      const id = view.presets[view.presets.length - 1].id;
      applyPresetView(view);
      await setPresetActive(id);
      setStatus("пресет «" + name + "» создан и активирован.");
    }
    currentPresetMode = mode;
    els.systemPrompt.value = text;
    presetSnapshot = text;
    closePresetModal();
    promptState();
  } catch (e) {
    setStatus("err: пресет не сохранён: " + e.message, "err");
  }
}
// delPreset — удалить выбранный пункт. Поле не трогаем: текст остаётся
// кастомным (сервер сам снимает привязку, если удалили активный).
async function delPreset() {
  const id = els.presetSelect.value;
  if (!id) {
    setStatus("пресет не выбран.");
    return;
  }
  const p = presetList.find(x => x.id === id);
  if (!await uiConfirm("Удалить пресет «" + (p ? p.name : "") + "»?")) return;
  try {
    const view = await presetRequest("DELETE", { id });
    applyPresetView(view);
    // При удалении пресета сервер снимает активную привязку (activePresetId = ""),
    // но сессионный currentPresetMode не трогается — сбрасываем явно, чтобы
    // последующий generate не ушёл случайно с режимом удалённого пресета.
    currentPresetMode = "";
    promptState();
    setStatus("пресет удалён — поле не изменилось.");
  } catch (e) {
    setStatus("err: пресет не удалён: " + e.message, "err");
  }
}

// dropStaleDrops — вакансия изменилась после compose: дропы собраны под прежний
// текст, и молча вырезать разделы по чужой вакансии нельзя (можно выбросить
// релевантный раздел — письмо станет слабее без предупреждения). Деградация — в
// безопасную сторону: полный профиль, как до compose.
function dropStaleDrops() {
  if (!promptDrops.length || els.vacancy.value === promptVacancy) return;
  promptDrops = [];
  promptDropStats = null;
  promptVacancy = "";
  renderDropInfo();
  setStatus("вакансия изменилась — отбор разделов сброшен, нажми compose заново.");
}

// renderDropInfo — что и на сколько вырезано из профиля: проверяемая
// автоматика вместо магии.
function renderDropInfo() {
  const el = els.promptDropInfo;
  if (!el) return;
  const parts = [];
  if (promptDrops.length) {
    let text = "профиль: часть разделов убрана (" + promptDrops.length + "): " +
      promptDrops.map(d => d.file + " / " + d.heading).join(", ") + ".";
    if (promptDropStats) {
      if (promptDropStats.droppedBytes > 0) {
        text += " " + Math.round(promptDropStats.sections) + " секций → вырезано " +
          promptDrops.length + ", −" +
          Math.round(promptDropStats.droppedBytes / 1024 * 10) / 10 + " КБ.";
      }
      if (promptDropStats.reason) text += " " + promptDropStats.reason;
    }
    parts.push(text);
  } else if (promptDropStats) {
    parts.push("профиль: резать нечего — все разделы релевантны вакансии.");
  }
  el.hidden = parts.length === 0;
  el.textContent = parts.join(" ");
}

// renderSentInfo — что РЕАЛЬНО ушло в модель, по данным SSE-done.
// Отдельный блок от renderDropInfo намеренно: там намерение композера
// (предвычисление), здесь факт от сервера. Если promptDrops потерялись по
// дороге, подпись compose останется прежней — увидит это только здесь.
// Расхождение между заявленным и применённым числом дропов = compose считал
// по устаревшему снимку профиля, нажмите compose заново.
function renderSentInfo(data) {
  const el = els.promptSentInfo;
  if (!el) return;
  const parts = [];
  // КБ округляются до 0.1, поэтому короткий системный промпт выглядел бы как
  // «0 КБ». Ниже килобайтового порога показываем байты — иначе строка вводит
  // в заблуждение сильнее, чем помогает.
  const kb = n => (n >= 1024 ? Math.round(n / 1024 * 10) / 10 + " КБ" : n + " Б");

  // Системный промпт: пользователю важно, ушёл его текст, пресет или дефолт.
  // Имя пресета показываем, только когда в модель ушёл именно его текст:
  // совпадение с полем при активном пресете ещё не доказывает источник
  // (поле могли наполнить вручную тем же текстом).
  const sent = (data.usedSystemPrompt || "").trim();
  const mine = els.systemPrompt.value.trim();
  let src = sent && sent === mine ? "ваш" : (sent ? "дефолтный" : "пустой");
  if (sent && presetActiveId) {
    const p = presetList.find(x => x.id === presetActiveId);
    if (p && sent === p.systemPrompt.trim()) src = "пресет «" + p.name + "»";
  }
  // Первая строка — самый дешёвый способ убедиться, что в модель ушёл
  // ожидаемый промпт, не раскрывая весь текст.
  const firstLine = sent.split("\n")[0].slice(0, 60);
  parts.push("в модель ушло: user-промпт " + kb(data.usedUserPromptBytes || 0) +
    ", профиль для фита " + kb(data.usedProfileBytes || 0) +
    "; системный промпт — " + src + " (" + kb(sent.length) + ")" +
    (firstLine ? ", начало: «" + firstLine + "»" : "") + ".");

  // Живой случай (октябрь 2026): в поле системного промпта оказался текст
  // самой вакансии — 63 КБ вместо обычных 1–5 КБ. Модель получила вакансию
  // дважды, причём второй раз в роли инструкции, а требования вроде
  // «RabbitMQ» читались как команды. Порог — вчетверо больше дефолта и не
  // меньше 8 КБ: ручной промпт с парой уточнений — норма, вакансия — нет.
  //
  // Условие намеренно НЕ привязано к src: если сервер отдал крупный промпт,
  // а поле уже очистили (пользователь жмёт reset во время генерации), то
  // src === "дефолтный" — но 58 КБ дефолтом быть не могут, и привязка к src
  // промолчала бы ровно в том случае, где предупреждение нужнее всего.
  let oversize = false;
  if (sent.length >= 8192 && defaultPrompt &&
      sent.length >= defaultPrompt.length * 4) {
    oversize = true;
    parts.push("внимание: системный промпт вчетверо больше дефолтного (" +
      kb(sent.length) + " против " + kb(defaultPrompt.length) +
      ") — если туда попал текст вакансии, вакансия уйдёт в модель дважды. " +
      "Очистите поле (reset default) и вставьте промпт руками.");
  }

  const applied = data.appliedDropSections || [];
  let mismatch = false;
  if (promptDrops.length) {
    if (applied.length === promptDrops.length) {
      parts.push("реально вырезано " + applied.length + ": " +
        applied.map(d => d.file + " / " + d.heading).join(", ") + ".");
    } else {
      mismatch = true;
      parts.push("ожидалось вырезать " + promptDrops.length +
        ", реально вырезано " + applied.length +
        " — часть заголовков не найдена в профиле, нажмите compose заново.");
    }
  } else if (applied.length) {
    // Сервер применил дропы, которых фронт не знает: значение изменилось
    // извне (другая вкладка) — показываем фактическое.
    parts.push("реально вырезано " + applied.length + ": " +
      applied.map(d => d.file + " / " + d.heading).join(", ") + ".");
  }
  // Класс отражает оба тревожных признака: расхождение дропов и раздутый
  // системный промпт. Оба означают «то, что ушло в модель, не то, что вы
  // ожидали», и оба обязаны быть заметны без чтения текста.
  el.className = (mismatch || oversize) ? "prompt-sentinfo mismatch" : "prompt-sentinfo";
  el.textContent = parts.join(" ");
  // Блок стартует скрытым и показывается только после ответа сервера: до
  // завершения генерации факта «что ушло в модель» ещё нет.
  el.hidden = false;
}
// composePrompt — один не-стриминговый вызов: отбор нерелевантных вакансии
// разделов профиля. Поле промпта не трогается: композер его не пишет.
async function composePrompt() {
  if (busy() || !els.vacancy.value.trim()) return;
  promptUndo = { drops: promptDrops, stats: promptDropStats, vacancy: promptVacancy };
  els.composePrompt.disabled = true;
  setStatus("отбираю разделы профиля под вакансию…");
  try {
    const r = await fetch("/api/prompt/compose", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ vacancy: els.vacancy.value }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ("код " + r.status));
    promptDrops = data.dropSections || [];
    promptDropStats = {
      sections: data.sections || 0,
      droppedBytes: data.droppedBytes || 0,
      reason: data.reason || "",
    };
    promptVacancy = els.vacancy.value;
    renderDropInfo();
    promptState();
    els.undoPrompt.hidden = false;
    let msg = "отбор разделов за " + ((data.elapsedMs || 0) / 1000).toFixed(1) + "s";
    msg += promptDrops.length ? " · убрано разделов: " + promptDrops.length : " · резать нечего";
    setStatus(msg + ".");
  } catch (e) {
    setStatus("err: compose не удался: " + e.message, "err");
  } finally {
    syncPromptButtons();
  }
}
// undoPrompt — восстановить отбор разделов до compose.
function undoPrompt() {
  if (!promptUndo) return;
  promptDrops = promptUndo.drops || [];
  promptDropStats = promptUndo.stats || null;
  promptVacancy = promptUndo.vacancy || "";
  promptUndo = null;
  els.undoPrompt.hidden = true;
  // Вакансия могла измениться после compose: тогда возвращать прежние дропы
  // нельзя — они собраны под другой текст (dropStaleDrops это и сбросит).
  dropStaleDrops();
  renderDropInfo();
  promptState();
}
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(readForm()),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      setStatus("config сохранён.");
    } catch (e) {
      setStatus("не удалось сохранить config: " + e.message, "err");
    }
  }, 400);
}

/* ---------- generate (SSE-стриминг) ---------- */
let liveTimer = null;
let genAbort = null;

// streamGenerate — POST /api/generate + парсинг SSE-потока. Дельты летят
// в onDelta по мере генерации, возвращает финальное событие done.
async function streamGenerate(body, onDelta) {
  // Контроллер живёт до конца чтения SSE-тела, а не до резолва fetch:
  // раньше genAbort обнулялся сразу после await fetch, и отмена (Esc/кнопка
  // stop) в середине генерации была бездейной.
  const ctrl = new AbortController();
  genAbort = ctrl;
  try {
    const r = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: ctrl.signal,
    });
    // Ошибки до старта стрима — обычные HTTP-коды с JSON-телом.
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.error || "HTTP " + r.status);
    }
    if (!r.body) throw new Error("браузер не поддерживает стриминг");
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", done = null;
    for (;;) {
      const { value, done: eof } = await reader.read();
      if (eof) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        const line = chunk.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.error) throw new Error(ev.error);
        if (ev.delta) onDelta(ev.delta);
        if (ev.done) done = ev;
      }
    }
    if (!done) throw new Error("соединение оборвалось без результата");
    return done;
  } finally {
    if (genAbort === ctrl) genAbort = null;
  }
}

function startTimer(label, t0) {
  liveTimer = setInterval(() => {
    const s = Math.floor((performance.now() - t0) / 1000);
    setStatus(`${label}… ${s} сек`);
  }, 1000);
}

async function generate() {
  if (!els.vacancy.value.trim() || els.generate.disabled) return;
  if (!els.model.value.trim()) {
    setStatus("err: model не задана — откройте api.config", "err");
    $("api-details").open = true;
    els.model.focus();
    return;
  }
  setBusy(true);
  // Живой счётчик: видно, что генерация идёт, а не зависла.
  const t0 = performance.now();
  setStatus("генерация… 0 сек");
  startTimer("генерация", t0);
  els.result.textContent = "";
  els.copy.disabled = true;
  // Факт предыдущего прогона прячем сразу: пока идёт новая генерация, показанные
  // байты и дропы относятся к уже завершённому письму, а не к текущему.
  if (els.promptSentInfo) { els.promptSentInfo.hidden = true; els.promptSentInfo.textContent = ""; }
  let live = 0;
  try {
    const data = await streamGenerate(
      { vacancy: els.vacancy.value, systemPrompt: els.systemPrompt.value, dropSections: promptDrops, mode: currentPresetMode },
      delta => {
        els.result.textContent += delta;
        // Автоскролл: письмо растёт, конец текста остаётся на виду.
        els.result.scrollTop = els.result.scrollHeight;
        live += delta.length;
        els.count.textContent = live + " chars";
      },
    );
    showAuditWarnings(data.warnings);
    showFitVerdict(data.fit, data.fitNote);
    reconcileEchoCallToAction(); // после отрисовки кнопок — см. echoCallToAction
    setProfileWarning(data.profileWarning);
    renderSentInfo(data);
    // Поле показывает поток дельт, а источник истины — data.letter. Если
    // сервер отклонил эхо промпта, в дельтах уже лежит мусор — приводим
    // вывод к ответу сервера (иначе копирование блокируется, а на экране
    // остаётся отклонённый текст).
    if (data.letter !== els.result.textContent) {
      els.result.textContent = data.letter || "";
      els.result.scrollTop = els.result.scrollHeight;
    }
    els.copy.disabled = !data.letter;
    countChars(data.elapsedMs);
    if (!data.letter) {
      setStatus("err: письмо не сохранено — модель вернула эхо промпта, повтори генерацию", "err");
    } else {
      setStatus(`ок — за ${(data.elapsedMs / 1000).toFixed(1)}s. Письмо можно править и копировать.`);
    }
  } catch (e) {
    if (e.name === "AbortError") setStatus("генерация остановлена (esc).");
    else setStatus("err: " + e.message, "err");
  } finally {
    clearInterval(liveTimer);
    setBusy(false);
  }
}

/* ---------- постпроверка письма ---------- */
let lastWarnings = [];
// lastDefects — реальные дефекты письма последней СОДЕРЖАТЕЛЬНОЙ проверки.
// Нужен отдельно от lastWarnings: тот перезаписывается каждым ответом, и при
// отклонённом эхо в нём остаётся только диагностика. Без lastDefects кнопка
// «повтори автоправку» исчезала бы ровно тогда, когда сервер зовёт ею
// воспользоваться (живой баг, октябрь 2026).
let lastDefects = [];
// lastFit — последние данные fit, используются fit-fix для повторных вызовов.
let lastFit = null;
// lastFitCaveats — строки caveat вида «текст — примечание», передаваемые в fitFix.
let lastFitCaveats = [];
// lastFitObjects — те же caveat, но объектами {text, note, source}. Нужны
// отдельно от lastFitCaveats (готовых строк): при отклонённом эхо вердикта
// нет, а перерисовать кнопку fit-fix можно только по объектам — строки не
// содержат note, по которому hasFixableCaveats отбирает fixable.
let lastFitObjects = [];

// isEchoWarning — замечание-диагностика про отклонённый ответ модели, а не
// дефект письма. Такое замечание нельзя отдавать модели на исправление:
// текст просит «исправить то, что ты и так вернул», любой провайдер в ответ
// повторяет эхо (живой кейс, октябрь 2026, воспроизведён на двух моделях).
// Строка сервера начинается с «модель вернула эхо промпта» либо «модель
// вернула ответ неприемлемого размера» — обе формы приходят в warnings.
function isEchoWarning(w) {
  return /эхо промпта/.test(w) || /неприемлемого размера/.test(w);
}

// letterDefects — только настоящие дефекты письма. То, что остаётся после
// отсечения isEchoWarning, и есть материал для автоправки.
function letterDefects(warnings) {
  return (Array.isArray(warnings) ? warnings : []).filter(w => !isEchoWarning(w));
}

function hasFixableCaveats(fit) {
  if (!fit) return false;
  const checks = (arr) => Array.isArray(arr) && arr.some(c => {
    const n = (c.note || "");
    return n.includes("впиши") || n.includes("не упомянуты");
  });
  return checks(fit.caveats) || checks(fit.covered);
}

function buildFitCaveatsList(fit) {
  if (!fit) return [];
  const results = [];
  const seen = new Set();
  for (const arr of [fit.caveats, fit.covered]) {
    if (!Array.isArray(arr)) continue;
    for (const c of arr) {
      const n = (c.note || "");
      if (n.includes("впиши") || n.includes("не упомянуты")) {
        const key = c.text + c.source;
        if (!seen.has(key)) {
          seen.add(key);
          results.push(c.text + (c.note ? " — " + c.note : ""));
        }
      }
    }
  }
  return results;
}

function showFitFixButton(fit) {
  // Рендерим в панель фита, а не audit-warns — audit-warns прячется при 0 замечаний.
  const box = els.fitVerdict;
  if (!box) return;
  const old = document.getElementById("fitFix");
  if (old) old.remove();
  if (!fit || !hasFixableCaveats(fit)) {
    return;
  }
  const fixable = buildFitCaveatsList(fit);
  if (fixable.length === 0) return;
  // Вердикта может не быть (отклонённое эхо), а кнопка автоправки нужна.
  // В этом случае панель скрыта, и кнопка внутри неё была бы невидимой —
  // выносим её в отдельный блок, который показываем рядом с баннером замечаний.
  const host = box.hidden ? fitFixFallbackBox() : box;
  const btn = document.createElement("button");
  btn.className = "btn term";
  btn.id = "fitFix";
  btn.type = "button";
  btn.style.marginTop = "8px";
  btn.innerHTML = "<span>fit-fix (" + fixable.length + ")</span>";
  btn.addEventListener("click", () => fitFix(3));
  host.appendChild(btn);
}

// fitFixFallbackBox — видимый контейнер для кнопки fit-fix на случай, когда
// панель вердикта скрыта (отклонённое эхо: fit == null). Отдельный блок рядом
// с панелью, потому что вердикт показывать нечего, а продолжать правку нужно.
function fitFixFallbackBox() {
  let el = document.getElementById("fitFixFallback");
  if (!el) {
    el = document.createElement("div");
    el.id = "fitFixFallback";
    el.style.marginTop = "8px";
    els.fitVerdict.parentNode.insertBefore(el, els.fitVerdict.nextSibling);
  }
  el.hidden = false;
  return el;
}

// CTA_AUDIT — призыв, которым сервер заканчивает эхо-предупреждение при откате
// на исходное письмо (internal/server/server.go). Призыв выбирается динамически,
// но распознать его в тексте можно только по этой исходной форме — поэтому она
// живёт здесь константой, а не литералом в трёх местах.
const CTA_AUDIT = "правь вручную или повтори автоправку";

// visibleButton — кнопка, которую пользователь действительно видит. Проверки
// «узел есть» мало: контейнер может быть скрыт (fitFixFallback), а узел внутри
// продолжает находиться по getElementById.
function visibleButton(id) {
  const el = document.getElementById(id);
  return !!el && !el.closest("[hidden]");
}

// echoCallToAction — призыв после отклонённого эхо по ТЕМ кнопкам, что реально
// нарисованы. Серверный текст (CTA_AUDIT) безусловен, а кнопок может не
// оказаться ни одной: auto-fix рисуется только при defects>0 || lastDefects>0,
// fit-fix — только при fixable-кавеатах. Живой баг (октябрь 2026): сообщение
// звало к кнопке, которой на экране не было.
function echoCallToAction() {
  if (visibleButton("auditFix")) return CTA_AUDIT;
  if (visibleButton("fitFix")) return "правь вручную или повтори fit-fix";
  return "правь вручную или запусти gen заново";
}

// reconcileEchoCallToAction — подставляет достижимый призыв в уже нарисованные
// тексты эхо-предупреждения (заголовок и пункты списка в панели замечаний).
// Вызывается ПОСЛЕ showFitVerdict: fit-fix рисуется именно там, и раньше мы ещё
// не знаем, появится ли кнопка. Безопасна при повторном вызове: showAuditWarnings
// каждый раз пересобирает панель с нуля, поэтому текст для подстановки берётся
// свежим, уже с исходным призывом от сервера.
function reconcileEchoCallToAction() {
  const box = els.auditWarns;
  if (!box || box.hidden) return;
  const cta = echoCallToAction();
  const nodes = box.querySelectorAll(".warn-title, li");
  for (const n of nodes) {
    if (!n.textContent.includes(CTA_AUDIT)) continue;
    n.textContent = n.textContent.replace(CTA_AUDIT, cta);
  }
}

function showAuditWarnings(warnings) {
  lastWarnings = Array.isArray(warnings) ? warnings : [];
  // Эхо-предупреждение показываем (пользователь должен знать, что письмо не
  // проверено), но в счётчик дефектов и в материал для автоправки оно не
  // идёт. Иначе UI писал «1 замечание — правь перед отправкой» про письмо,
  // которое проверяли и не нашли (живой кейс: эхо отклонено, письмо целое).
  const defects = letterDefects(lastWarnings);
  const echoMsgs = lastWarnings.filter(isEchoWarning);
  // Содержательная проверка обновила набор дефектов; эхо — нет: письмо не
  // проверяли, и прежние дефекты остаются в силе.
  if (defects.length > 0) lastDefects = defects;
  const box = els.auditWarns;
  if (lastWarnings.length === 0) {
    box.hidden = true;
    box.textContent = "";
    return;
  }
  box.textContent = "";
  const title = document.createElement("span");
  title.className = "warn-title";
  if (defects.length === 0) {
    // Письмо не проверялось вовсе — формулировка про «правь перед отправкой»
    // здесь ложная, показываем честную причину.
    title.textContent = echoMsgs[0];
  } else {
    title.textContent = "⚠ проверка письма: " + defects.length +
      (defects.length === 1 ? " замечание" : " замечаний") + " — правь перед отправкой";
  }
  box.appendChild(title);
  const ul = document.createElement("ul");
  // Дубликат заголовка-эхо в списке не нужен: при defects.length === 0 он
  // был бы единственной строкой и совпал бы с заголовком.
  const listed = defects.length === 0 ? [] : lastWarnings;
  for (const w of listed) {
    const li = document.createElement("li");
    li.textContent = w;
    ul.appendChild(li);
  }
  if (listed.length) box.appendChild(ul);
  // Кнопка нужна в двух случаях. Обычный — есть свежие дефекты. И второй:
  // при отклонённом эхо, когда письмо не проверяли, — повторяем автоправку по
  // ПРЕЖНИМ дефектам (lastDefects), потому что сервер прямо зовёт «правь
  // вручную или повтори автоправку». Кнопка при этом возвращает ровно то,
  // что и раньше, и не отправляет модели эхо-диагностику.
  if (defects.length > 0 || lastDefects.length > 0) {
    const fixBtn = document.createElement("button");
    fixBtn.className = "btn term";
    fixBtn.id = "auditFix";
    fixBtn.type = "button";
    fixBtn.style.marginTop = "8px";
    const n = defects.length > 0 ? defects.length : lastDefects.length;
    fixBtn.innerHTML = defects.length > 0
      ? "<span>auto-fix</span>"
      : "<span>auto-fix (" + n + ")</span> — повторить по прошлым замечаниям";
    fixBtn.addEventListener("click", auditFix);
    box.appendChild(fixBtn);
  }
  box.hidden = false;
}

/* ---------- рекомендация отклика (internal/fit) ---------- */

// showFitVerdict рендерит вердикт фита из события done. fit == null —
// разбор вакансии не удался, панель без вердикта. fitNote — причина
// (упавший/пустой разбор): её показываем ВНУТРИ панели, иначе она
// просто исчезала, а кнопка fit-fix оставалась — пользователь видел
// противоречие и принимал это за поломку (живой баг, октябрь 2026).
function showFitVerdict(fit, fitNote) {
  lastFit = fit;
  // При отклонённом эхо fit == null, и прошлые caveat перестали бы быть
  // доступны: кнопка fit-fix живёт в панели вердикта и исчезала бы вместе с
  // ней. А именно в этом состоянии пользователю нужно продолжать правку.
  // Храним ОБЪЕКТЫ caveat, а не готовые строки: hasFixableCaveats и
  // showFitFixButton читают c.note, и строки прошли бы мимо как {note: ""}.
  if (fit) {
    lastFitObjects = [...(fit.caveats || []), ...(fit.covered || [])];
    lastFitCaveats = buildFitCaveatsList(fit);
  }
  const box = els.fitVerdict;
  if (!fit || !fit.verdict) {
    box.textContent = "";
    box.className = "";
    if (fitNote) {
      // Вердикта нет — но почему, пользователь должен увидеть, а не
      // гадать по исчезнувшей панели.
      box.hidden = false;
      box.className = "verdict-note";
      const note = document.createElement("span");
      note.className = "fit-title";
      note.textContent = "⚠ " + fitNote;
      box.appendChild(note);
    } else {
      box.hidden = true;
    }
    // Вердикта нет, но продолжить автоправку можно — рисуем кнопку из
    // сохранённых caveat, только если они реально есть.
    if (lastFitObjects.length > 0) showFitFixButton({ caveats: lastFitObjects });
    else {
      // Контейнер чистим, а не просто прячем: оставленная в нём кнопка
      // продолжает находиться по getElementById, и призыв «повтори fit-fix»
      // указывал бы на кнопку, которой на экране нет (живой баг, октябрь 2026).
      const fb = document.getElementById("fitFixFallback");
      if (fb) { fb.hidden = true; fb.textContent = ""; }
    }
    return;
  }
  // Вердикт есть — кнопка живёт в панели, запасной блок не нужен.
  const stale = document.getElementById("fitFixFallback");
  if (stale) { stale.hidden = true; stale.textContent = ""; }
  const labels = {
    apply: "откликаться",
    apply_with_caveats: "откликаться с оговоркой",
    skip: "не откликаться",
  };
  box.textContent = "";
  box.className = "verdict-" + fit.verdict;
  const title = document.createElement("span");
  title.className = "fit-title";
  const roleLabels = { "go-primary": "go-primary", "php-primary": "php-primary", "ml-research": "ml-research", "fullstack": "fullstack" };
  title.textContent = "→ " + labels[fit.verdict] + " · соответствие ~" + fit.score + "%" +
    (roleLabels[fit.role] ? " · роль: " + fit.role : "");
  box.appendChild(title);
  // Source из fit.Req объясняет вес: письмо (1.0), профиль-но-не-в-письме
  // (0.7 — стоит дописать), мост (0.5), нет данных (0.2).
  const srcLabels = {
    letter: "письмо",
    profile: "письмо, но не в письме",
    bridge: "мост",
    unknown: "нет данных",
    missing: "нет",
  };
  const fmtReq = r => {
    const src = srcLabels[r.source] || "";
    const note = r.note ? " — " + r.note : "";
    return (src ? "[" + src + "] " : "") + r.text + note;
  };
  const sections = [
    ["✔ закрыто:", fit.covered, fmtReq],
    ["△ с оговоркой:", fit.caveats, fmtReq],
    ["✖ не закрыто:", fit.missing, fmtReq],
  ];
  for (const [label, reqs, fmt] of sections) {
    if (!reqs || !reqs.length) continue;
    const b = document.createElement("b");
    b.textContent = label;
    box.appendChild(b);
    const ul = document.createElement("ul");
    for (const r of reqs) {
      const li = document.createElement("li");
      li.textContent = fmt(r);
      ul.appendChild(li);
    }
    box.appendChild(ul);
  }
  if (fit.advice && fit.advice.length) {
    const b = document.createElement("b");
    b.textContent = "→ в письме:";
    box.appendChild(b);
    const ul = document.createElement("ul");
    for (const a of fit.advice) {
      const li = document.createElement("li");
      li.textContent = a;
      ul.appendChild(li);
    }
    box.appendChild(ul);
  }
  box.hidden = false;
  showFitFixButton(fit);
}

// Автоправка: сервер отдаёт письмо обратно модели с списком замечаний,
// получает исправленный текст (стримингом — видно, как модель правит) и
// проверяет его повторно. Кнопка остаётся, пока замечания не кончатся
// или пользователь не остановит генерацию.
async function auditFix() {
  const btn = document.getElementById("auditFix");
  if (!btn || btn.disabled || busy()) return;
  // Модели уходят только дефекты письма. Эхо-предупреждение в список не идёт:
  // это диагностика про прошлый ответ, и инструкция «исправь это» приводила
  // к повтору эха у любого провайдера (живой кейс, октябрь 2026).
  // При отклонённом эхо письмо не проверяли — автоправка повторяется по
  // ПРЕЖНИМ дефектам (lastDefects), иначе кнопка, которую сервер просит
  // нажать, ничего не отправила бы. Проверка ДО setBusy/try: ранний return
  // внутри try не дошёл бы до finally и оставил бы интерфейс заблокированным.
  const defects = letterDefects(lastWarnings);
  const toSend = defects.length > 0 ? defects : lastDefects;
  if (toSend.length === 0) {
    setStatus("err: отклонённое эхо — исправлять нечего, письмо не проверялось. Правь вручную или смени модель", "err");
    return;
  }
  btn.disabled = true;
  setBusy(true);
  const t0 = performance.now();
  setStatus("автоправка… 0 сек");
  startTimer("автоправка", t0);
  const letter = els.result.textContent; // исходное письмо — до очистки поля
  els.result.textContent = "";
  let live = 0;
  try {
    const data = await streamGenerate(
      {
        vacancy: els.vacancy.value,
        systemPrompt: els.systemPrompt.value,
        auditFix: true,
        letter: letter,
        warnings: toSend,
        dropSections: promptDrops,
      },
      delta => {
        els.result.textContent += delta;
        els.result.scrollTop = els.result.scrollHeight;
        live += delta.length;
        els.count.textContent = live + " chars";
      },
    );
    showAuditWarnings(data.warnings);
    showFitVerdict(data.fit, data.fitNote);
    reconcileEchoCallToAction(); // после отрисовки кнопок — см. echoCallToAction
    setProfileWarning(data.profileWarning);
    renderSentInfo(data);
    // Как и в generate: ответ сервера важнее дельт — при отклонённом эхо
    // исходное письмо восстанавливается, мусор из потока убирается.
    if (data.letter !== els.result.textContent) {
      els.result.textContent = data.letter || "";
      els.result.scrollTop = els.result.scrollHeight;
    }
    countChars(data.elapsedMs);
    els.copy.disabled = !data.letter;
    setStatus(data.warnings && data.warnings.length
      ? `ок — замечаний осталось: ${data.warnings.length}`
      : "ок — замечаний больше нет.");
  } catch (e) {
    if (e.name === "AbortError") setStatus("автоправка остановлена (esc).");
    else setStatus("err: автоправка не удалась: " + e.message, "err");
    btn.disabled = false;
  } finally {
    clearInterval(liveTimer);
    setBusy(false);
  }
}

// Fit-fix: цикл автоисправления по fit-caveats (максимум maxIter итераций).
// Аналог auditFix, но использует fitCaveats вместо warnings.
async function fitFix(maxIter) {
  const btn = document.getElementById("fitFix");
  if (!btn || btn.disabled || busy()) return;
  btn.disabled = true;
  setBusy(true);
  const t0 = performance.now();
  setStatus("fit-fix… 0 сек");
  startTimer("fit-fix", t0);
  // Одна итерация по умолчанию: каждая тянет генерацию (таймаут настроек,
  // до 60 сек) плюс fitMapTimeout (90 сек) — три итерации молчали почти
  // 7,5 минуты (живой кейс: «виснет и выводит полный контент профиля»).
  // Повторный клик — осознанное решение пользователя.
  let remaining = maxIter || 1;
  let caveats = [...lastFitCaveats];
  // Число fixable в прошлой итерации: без него цикл крутился, даже когда
  // автоправка ничего не улучшала (живой кейс — тот же).
  let prevFixable = caveats.length;
  try {
    while (remaining > 0 && caveats.length > 0) {
      const letter = els.result.textContent;
      els.result.textContent = "";
      let live = 0;
      const data = await streamGenerate(
        {
          vacancy: els.vacancy.value,
          systemPrompt: els.systemPrompt.value,
          fitFix: true,
          fitMaxIter: 1,
          letter: letter,
          fitCaveats: caveats,
          dropSections: promptDrops,
        },
        delta => {
          els.result.textContent += delta;
          els.result.scrollTop = els.result.scrollHeight;
          live += delta.length;
          els.count.textContent = live + " chars";
        },
      );
        showAuditWarnings(data.warnings);
        showFitVerdict(data.fit, data.fitNote);
        reconcileEchoCallToAction(); // после отрисовки кнопок — см. echoCallToAction
        setProfileWarning(data.profileWarning);
        renderSentInfo(data);
        // Показанный текст — это поток дельт, а НЕ то, что сервер вернул в
        // data.letter. При отклонённом эхе промпта сервер отдаёт исходное
        // письмо (или пустое), а в поток уже уехал кусок файла профиля.
        // Живой баг (сентябрь 2026): UI продолжал показывать «грязный» профиль
        // и на следующей итерации отправлял его обратно как исходное письмо —
        // цикл разгонялся, приложение падало. Приводим вывод к ответу сервера.
        if (data.letter !== els.result.textContent) {
          els.result.textContent = data.letter || "";
          els.result.scrollTop = els.result.scrollHeight;
          countChars((data.letter || "").length);
        }
        if (!data.letter) {
          setStatus("err: модель вернула эхо промпта вместо письма — показывать нечего, повтори генерацию", "err");
          break;
        }
        // Отклонённое эхо: сервер вернул исходное письмо (оно непустое, поэтому
        // проверка выше прошла). Продолжать цикл бессмысленно — модель только
        // что вернула эхо, и повтор по тем же замечаниям повторит его.
        const echoHit = (data.warnings || []).some(isEchoWarning);
        if (echoHit) {
          // Вердикт по уцелевшему письму теперь считается на сервере, панель
          // выше уже показана. Различаем два случая: с вердиктом сообщаем, что
          // он актуален; без него — что оценки нет.
          setStatus(data.fit
            ? "автоправка вернула эхо — исходное письмо сохранено, вердикт выше актуален. " + echoCallToAction()
            : "err: автоправка вернула эхо — исходное письмо сохранено, вердикт фита недоступен. Правь вручную или смени модель",
            data.fit ? "" : "err");
          break;
        }
        if (!data.fit) {
          // Разбор вакансии упал — вердикта нет, а fitFixable при этом 0.
          // Без этой проверки пользователь видит «fit-fix завершён» и считает,
          // что письмо доведено, хотя цикл проверки просто не отработал.
          // Причина (fitNote) важна: «упал разбор» и «требований нет» —
          // разные действия пользователя.
          setStatus("err: fit-разбор вакансии не удался — цикл прерван, проверь письмо вручную"
            + (data.fitNote ? " · " + data.fitNote : ""), "err");
          break;
        }
        countChars(data.elapsedMs);
        els.copy.disabled = !data.letter;
        const newFixable = (data.fitFixable != null) ? data.fitFixable
          : buildFitCaveatsList(data.fit).length;
      if (newFixable === 0) {
        setStatus("ok — fit-fix завершён (" + (maxIter - remaining + 1) + " итер.)");
        break;
      }
      caveats = buildFitCaveatsList(data.fit);
      remaining--;
      // Нет прогресса — дальше крутить бессмысленно: модель не смогла закрыть
      // эти требования и повторит то же самое. Лучше явная остановка, чем
      // ещё две итерации по 150 секунд.
      if (newFixable >= prevFixable) {
        setStatus("fit-fix: без прогресса — " + newFixable +
          " требований осталось, автоправка не помогла. Правь вручную.");
        break;
      }
      prevFixable = newFixable;
      if (remaining > 0) {
        setStatus("fit-fix… " + (maxIter - remaining) + "/" + maxIter);
      } else {
        setStatus("fit-fix: достигнут лимит итераций, попробуйте вручную");
      }
    }
  } catch (e) {
    if (e.name === "AbortError") setStatus("fit-fix остановлен (esc).");
    else setStatus("err: fit-fix не удался: " + e.message, "err");
    // Сбрасываем стейт только при ошибке/прерывании — при успешном выходе
    // (в т.ч. по лимиту итераций) lastFit остаётся, чтобы кнопка fit-fix
    // была доступна для повторного клика с актуальным списком caveat.
  } finally {
    clearInterval(liveTimer);
    setBusy(false);
  }
}

/* ---------- copy ---------- */
async function copyResult() {
  const text = els.result.textContent;
  if (!text) return;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {}
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    ok = document.execCommand("copy"); ta.remove();
  }
  els.copy.classList.toggle("ok", ok);
  els.copy.querySelector("span").textContent = ok ? "copied ✓" : "fail";
  setTimeout(() => {
    els.copy.classList.remove("ok");
    els.copy.querySelector("span").textContent = "copy";
  }, 1500);
}
function countChars(elapsedMs) {
  const n = els.result.textContent.length;
  const t = typeof elapsedMs === "number" && elapsedMs > 0
    ? " · " + (elapsedMs / 1000).toFixed(1) + "s" : "";
  els.count.textContent = n ? n + " chars" + t : "";
}

/* ---------- wire up ---------- */
async function boot() {
  try {
    const r = await fetch("/api/settings");
    if (!r.ok) throw new Error("HTTP " + r.status);
    fillForm(await r.json());
    setStatus("готово.");
  } catch (e) {
    setStatus("err: настройки не загрузились: " + e.message, "err");
  }
  for (const el of [els.baseUrl, els.apiKey, els.model, els.reasoningEffort, els.timeoutSec, els.fitEngine]) {
    el.addEventListener("input", scheduleSave);
    el.addEventListener("change", scheduleSave);
  }
  // Промпт не автосейвится: кастом живёт до перезапуска, сброс — кнопкой.
  els.systemPrompt.addEventListener("input", promptState);
  $("resetPrompt").addEventListener("click", resetPrompt);
  els.composePrompt.addEventListener("click", composePrompt);
  els.undoPrompt.addEventListener("click", undoPrompt);
  // Пресеты: загрузка списка после настроек (активный → в поле) + CRUD.
  await loadPresets();
  els.presetSelect.addEventListener("change", switchPreset);
  els.savePreset.addEventListener("click", savePreset);
  els.editPreset.addEventListener("click", () => openPresetModal("edit"));
  els.newPreset.addEventListener("click", newPreset);
  els.delPreset.addEventListener("click", delPreset);
  $("presetOk").addEventListener("click", submitPresetModal);
  $("presetCancel").addEventListener("click", closePresetModal);
  $("presetText").addEventListener("input", updatePresetLen);
  // Клик по подложке — закрыть, как cancel (Esc обрабатывается ниже).
  $("presetModal").addEventListener("click", e => {
    if (e.target === $("presetModal")) closePresetModal();
  });
  // Подтверждение: ok/отмена, клик по подложке — отмена (как Esc).
  $("confirmOk").addEventListener("click", () => settleConfirm(true));
  $("confirmCancel").addEventListener("click", () => settleConfirm(false));
  $("confirmModal").addEventListener("click", e => {
    if (e.target === $("confirmModal")) settleConfirm(false);
  });
  els.vacancy.addEventListener("input", () => {
    els.generate.disabled = !els.vacancy.value.trim() || document.body.classList.contains("busy");
    dropStaleDrops();
    syncPromptButtons();
  });
  els.generate.addEventListener("click", generate);
  els.stop.addEventListener("click", () => {
    // Между setBusy(true) и созданием контроллера (в streamGenerate)
    // genAbort ещё null — клик тогда просто ничего не делает.
    if (!genAbort) return;
    genAbort.abort();
    setStatus("остановлено по кнопке stop.");
  });
  els.copy.addEventListener("click", copyResult);
  els.result.addEventListener("input", countChars);
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); generate(); }
    if (e.key === "Escape") {
      // Подтверждение — самое верхнее окно (может висеть над модалкой
      // пресета): Esc = отмена, резолвит uiConfirm(false).
      if (!$("confirmModal").hidden) { settleConfirm(false); return; }
      // Модалка пресета закрывается первой: Esc «на весь документ» не должен
      // очищать результат, пока пользователь правит имя/текст пресета.
      if (!$("presetModal").hidden) { closePresetModal(); return; }
      // Останов активной генерации + очистка результата. Письмо очищено —
      // панель замечаний (и список для auto-fix) тоже уходит.
      if (genAbort) genAbort.abort();
      els.result.textContent = ""; els.copy.disabled = true; countChars();
      showAuditWarnings([]);
      setProfileWarning("");
      // Факт «что ушло в модель» относится к конкретному прогону: остановили —
      // блок не должен продолжать показывать прошлый user-промпт.
      if (els.promptSentInfo) { els.promptSentInfo.hidden = true; els.promptSentInfo.textContent = ""; }
      lastFit = null; lastFitCaveats = []; lastFitObjects = [];
      lastDefects = [];
      const fb = document.getElementById("fitFixFallback");
      if (fb) { fb.hidden = true; fb.textContent = ""; }
    }
  });
  els.vacancy.focus();
  syncPromptButtons(); // compose гаснет, пока вакансия пуста
}
boot();
</script>
</html>
